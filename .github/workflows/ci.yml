name: CI

# Copied from afrikaburn-contributors-app (origin/main:.github/workflows/ci.yml)
# and trimmed to what this repo has today.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` as well as the defaults, so renaming a PR re-runs commitlint on
    # the new title. Without it a PR retitled after a green run keeps its
    # green check.
    types: [opened, synchronize, reopened, edited]

# LEAST PRIVILEGE. Nothing here writes back except the coverage comment, which
# asks for `pull-requests: write` on its own job. A compromised dependency in a
# build step then has no token worth stealing.
permissions:
  contents: read

# One run per branch. Pushing again cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits with a closed scope list (AGENTS.md,
  # commitlint.config.mjs). BOTH halves are checked, because PRs are merged
  # rather than squashed: every commit lands on `main`, so linting only the
  # title would let unconventional history through, and linting only the
  # commits would leave the PR list unchecked. The husky hook covers the same
  # ground locally, but `--no-verify` skips it. This does not.
  commitlint:
    name: commit conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # `fetch-depth: 0`: the range check needs the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `version:`, so the action reads `packageManager` from package.json
      # and CI cannot drift from what developers run.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A config that accepts everything would make both steps below pass by
      # not checking anything. Prove it still separates good from bad, and that
      # Dependabot's header (which names no workspace scope) gets through.
      - name: Self-test the commitlint config
        run: |
          set -euo pipefail
          # Dependabot's real headers capitalise `Bump`, in the PR title and the commit.
          printf '%s' 'chore(deps): Bump davelosert/vitest-coverage-report-action from 2.12.2 to 2.13.0' | pnpm exec commitlint
          printf '%s' 'chore(deps-dev): Bump the minor-and-patch group across 1 directory with 12 updates' | pnpm exec commitlint
          printf '%s' 'chore(deps): bump next from 16.3.6 to 16.4.0' | pnpm exec commitlint
          printf '%s' 'ci(repo): add the ci pass gate' | pnpm exec commitlint
          for bad in 'Bad Title' 'bad message' 'chore(deps): Update everything'; do
            if printf '%s' "$bad" | pnpm exec commitlint >/dev/null 2>&1; then
              echo "::error::commitlint accepted '$bad'"
              exit 1
            fi
          done
          echo "commitlint config accepts bot and conventional headers and rejects bad ones."

      # The title goes through env, never interpolated into the script: a PR
      # title is attacker-controlled text.
      - name: Lint the pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint

      # Every commit the PR adds, from the base sha to the head sha. Anything
      # already on main is out of scope.
      - name: Lint the commits in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile`: a package.json change without a lockfile update
      # fails here instead of resolving to something nobody has run locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MIGRATION DRIFT. schema.ts is the only source of truth and migrations
      # are generated from it, so regenerating must change nothing. An edited
      # schema without its migration shows up here as a new or modified file
      # under migrations/ (`--porcelain` lists untracked files too). Copied
      # from camp-404 `.github/workflows/ci.yml`. Needs no database.
      - name: Check migrations match schema.ts
        run: |
          pnpm --filter @baumy/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/migrations/)" ]; then
            echo "::error::packages/db/migrations is out of date with src/schema.ts. Run 'pnpm --filter @baumy/db db:generate' and commit the result."
            git status --porcelain packages/db/migrations/
            git diff packages/db/migrations/ | head -100
            exit 1
          fi
          echo "packages/db/migrations is up to date with src/schema.ts."

      # The same command AGENTS.md calls the gate.
      - name: CI gate
        run: pnpm turbo run format:check lint typecheck test build

      # The deploy scripts (ADR 0004): the Vercel ignored-build step and the
      # Neon preview provisioning, the latter against a fake curl. shellcheck
      # ships on the ubuntu runner.
      - name: Test the deploy shell scripts
        run: |
          shellcheck scripts/vercel-ignore-build.sh scripts/neon-preview-env.sh \
            scripts/tests/*.sh scripts/tests/fake-bin/curl
          for t in scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  # COVERAGE AS A RATCHET. The floors live in each workspace's
  # `vitest.config.ts`, so `pnpm test:coverage` enforces them identically on a
  # laptop and here. `turbo run test:coverage` covers every workspace that has
  # the script, so a new package is gated the moment it adds one; only the PR
  # comment below needs a step per workspace.
  #
  # This job is in `CI pass`'s needs, so a breached floor blocks the merge.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage against the floors
        run: pnpm turbo run test:coverage

      # PINNED TO A COMMIT, NOT A TAG: this step holds `pull-requests: write`
      # and a tag can be repointed. The comment keeps the version for
      # Dependabot.
      #
      # Same-repo PRs only: a fork's `pull_request` token is read-only whatever
      # this job asks for. Dependabot PRs are same-repo but also get a read-only
      # token, hence `continue-on-error`: a reporting failure must never be
      # what blocks a branch with green floors. The floors step above is the
      # one allowed to fail this job.
      - name: Report coverage for @baumy/web
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/web"
          working-directory: apps/web
          file-coverage-mode: changes

      - name: Report coverage for @baumy/auth
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/auth"
          working-directory: packages/auth
          file-coverage-mode: changes

      - name: Report coverage for @baumy/types
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/types"
          working-directory: packages/types
          file-coverage-mode: changes

      - name: Report coverage for @baumy/core
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/core"
          working-directory: packages/core
          file-coverage-mode: changes

      - name: Report coverage for @baumy/db
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/db"
          working-directory: packages/db
          file-coverage-mode: changes

      - name: Report coverage for @baumy/ui
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: "@baumy/ui"
          working-directory: packages/ui
          file-coverage-mode: changes

  # THE LOCAL STACK, AS A DEVELOPER RUNS IT. Starts docker-compose.local.yml
  # (Postgres 17 and both Neon proxies), applies every migration from empty
  # through the app's own driver, applies them again (a second run must be a
  # no-op), then runs the tests PGlite cannot: concurrent calls on separate
  # connections. No secrets: this is Docker on the runner, never Neon.
  db-local:
    name: db · docker postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local database
        run: pnpm db:local:up

      - name: Migrate from empty, twice
        run: |
          pnpm db:local:migrate
          pnpm db:local:migrate

      # The starter chores (SPEC §4.7): the second run must add nothing.
      - name: Seed, twice
        run: |
          pnpm db:local:seed | tee "$RUNNER_TEMP/seed1.log"
          grep -q "added 11 starter chores" "$RUNNER_TEMP/seed1.log"
          pnpm db:local:seed | tee "$RUNNER_TEMP/seed2.log"
          grep -q "nothing to do" "$RUNNER_TEMP/seed2.log"

      - name: Run the Docker Postgres tests
        run: pnpm db:local:test

      # The preview migrate guard (ADR 0004) through the real `vercel-build`
      # entry point. wsproxy ignores the host in the URL, so the "production"
      # host here is just a name the guard compares against.
      - name: Preview migrate guard refuses the production host
        env:
          NEON_LOCAL_PROXY: "1"
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:54329/baumy
        run: |
          set +e
          VERCEL_ENV=preview PROD_DB_HOST=localhost \
            pnpm --filter @baumy/web run vercel-build > "$RUNNER_TEMP/guard.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/guard.log"
          if [ "$code" -eq 0 ]; then
            echo "::error::vercel-build ran on a preview pointed at PROD_DB_HOST"
            exit 1
          fi
          grep -q "points at the production host" "$RUNNER_TEMP/guard.log"
          if grep -q "Creating an optimized production build" "$RUNNER_TEMP/guard.log"; then
            echo "::error::next build started after the guard refused"
            exit 1
          fi
          if VERCEL_ENV=preview PROD_DB_HOST=localhost \
            pnpm --filter @baumy/db db:seed > "$RUNNER_TEMP/seed-guard.log" 2>&1; then
            echo "::error::db:seed ran on a preview pointed at PROD_DB_HOST"
            exit 1
          fi
          grep -q "points at the production host" "$RUNNER_TEMP/seed-guard.log"
          VERCEL_ENV=preview PROD_DB_HOST=ep-prod.eu-central-1.aws.neon.tech \
            pnpm --filter @baumy/db db:migrate
          VERCEL_ENV=production pnpm --filter @baumy/db db:migrate

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --no-color | tail -200

  # THE E2E SUITE. Runs scripts/e2e-local.sh, the same script a developer runs,
  # so the two cannot drift: Docker Postgres and both Neon proxies, migrate
  # from empty, next build + next start in E2E test mode, then every
  # Playwright project. Ported from afrikaburn (origin/main:.github/workflows/
  # ci.yml, job `e2e`), as one job rather than a per-persona matrix while the
  # suite is small. No secrets: nothing here touches Neon, Vercel or Google.
  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @baumy/web exec playwright install --with-deps chromium

      - name: Run the suite
        env:
          # Start from an empty database, not whatever a cached volume holds.
          E2E_RESET_DB: "1"
          # The production bundle: no first-request compiles, and it is what
          # ships.
          E2E_SERVE: build
        run: ./scripts/e2e-local.sh

      # The boot guard, against the real build: test mode on a Vercel
      # environment must refuse to start (apps/web/lib/test-mode.ts).
      - name: Refuse to boot with E2E_TEST_MODE=1 on Vercel
        working-directory: apps/web
        run: |
          set +e
          E2E_TEST_MODE=1 VERCEL_ENV=preview timeout 60 pnpm exec next start --port 3099 > "$RUNNER_TEMP/boot.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/boot.log"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::next start did not refuse E2E_TEST_MODE=1 with VERCEL_ENV=preview (exit $code)"
            exit 1
          fi
          grep -q "refuses to boot" "$RUNNER_TEMP/boot.log"
          echo "next start refused to boot (exit $code)."

      # Auth fails closed (packages/auth `authMayServe`), against the real
      # build: on a Vercel environment without BETTER_AUTH_SECRET every
      # /api/auth/* answers 503 and /api/me finds nobody signed in.
      - name: Auth fails closed on Vercel without a secret
        working-directory: apps/web
        run: |
          env -u E2E_TEST_MODE -u BETTER_AUTH_SECRET VERCEL_ENV=preview \
            pnpm exec next start --port 3098 > "$RUNNER_TEMP/closed.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3098/api/health && break
            sleep 1
          done
          get=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3098/api/auth/get-session)
          post=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"email":"a@b.c","password":"x"}' \
            http://localhost:3098/api/auth/sign-in/email)
          me=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3098/api/me)
          echo "get-session=$get sign-in=$post me=$me"
          if [ "$get" != 503 ] || [ "$post" != 503 ] || [ "$me" != 401 ]; then
            cat "$RUNNER_TEMP/closed.log"
            echo "::error::auth did not fail closed with VERCEL_ENV=preview and no BETTER_AUTH_SECRET"
            exit 1
          fi

      # The server's side of a failure: without it a red run shows only the
      # browser's "page.goto timed out".
      - name: Collect the server log
        if: always()
        run: |
          cp "${TMPDIR:-/tmp}/baumy-e2e/server.log" server.log 2>/dev/null || true
          cp "${TMPDIR:-/tmp}/baumy-e2e/build.log" build.log 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            server.log
            build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --no-color | tail -200

  # THE ONE REQUIRED CHECK. Rulesets require checks by name, so requiring each
  # job means re-editing the ruleset whenever a job is added, and a job nobody
  # marked required can go red without blocking. So the ruleset requires
  # exactly `CI pass`.
  #
  # `if: always()` is what makes it work: without it this job is SKIPPED when
  # an upstream job fails, and a skipped required check does not block a merge.
  ci-pass:
    name: CI pass
    if: always()
    needs: [commitlint, ci, coverage, db-local, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          COMMITLINT: ${{ needs.commitlint.result }}
          CI_RESULT: ${{ needs.ci.result }}
          COVERAGE: ${{ needs.coverage.result }}
          DB_LOCAL: ${{ needs.db-local.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "commit conventions : $COMMITLINT"
          echo "format/lint/...    : $CI_RESULT"
          echo "coverage floors    : $COVERAGE"
          echo "docker postgres    : $DB_LOCAL"
          echo "e2e                : $E2E"
          echo

          # Unconditional: these run on every event and must succeed.
          for job in "ci:$CI_RESULT" "coverage:$COVERAGE" "db-local:$DB_LOCAL" "e2e:$E2E"; do
            name="${job%%:*}"; result="${job#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not pass (result: $result)"
              exit 1
            fi
          done

          # `commitlint` only runs on pull requests, so `skipped` is legitimate
          # on a push to main. Anything else (failure, cancelled) fails.
          case "$COMMITLINT" in
            success|skipped) ;;
            *)
              echo "::error::commit conventions did not pass (result: $COMMITLINT)"
              exit 1
              ;;
          esac

          echo "All jobs passed."
