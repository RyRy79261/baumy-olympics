name: Neon preview branch for PR

# Copied from afrikaburn-contributors-app (origin/main:.github/workflows/
# neon-pr-preview.yml) per ADR 0004. Pairs with neon-pr-cleanup.yml: this one
# CREATES the preview database branch `preview/<head ref>`, that one deletes it
# (and its Vercel env rows) when the PR closes.
#
# WHY NOT THE VERCEL–NEON INTEGRATION. The integration never deletes the
# branches it creates (see neon-pr-cleanup.yml and docs/deploy.md for the
# quota incident), and it cannot write NEON_PREVIEW_READY, which
# scripts/vercel-ignore-build.sh waits for so that no preview build ever
# migrates the Preview-scope default database.
#
# OPT-IN. Without the five secrets below the script exits 0 with a notice, so
# this file is inert until someone configures it. It does NOT turn PRs red.
#
#   NEON_API_KEY          NEON_PROJECT_ID
#   VERCEL_TOKEN          VERCEL_ORG_ID (team_…)
#   VERCEL_PROJECT_IDS    comma-separated prj_… list (today: apps/web only)
#
# `pull_request_target`, matching neon-pr-cleanup.yml, and for the same reason:
# it runs the workflow and script from the BASE branch, never from the PR head.
# That matters here because this job holds VERCEL_TOKEN: under `pull_request`
# a PR could edit scripts/neon-preview-env.sh and exfiltrate it. The job checks
# out no PR code; it reads event metadata and calls two REST APIs.
#
# Use the workflow_dispatch input to verify the wiring on a branch before it
# has merged (that is the case `pull_request_target` cannot cover).

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      head_ref:
        description: Git head branch name (e.g. ci/5-verify-neon-preview)
        required: true
        type: string

permissions:
  contents: read

# A second push should supersede the first: the later commit's env wins, and a
# cancelled run leaves nothing half-written (branch create is idempotent, env
# rows are replaced, and NEON_PREVIEW_READY is written last).
concurrency:
  group: neon-preview-${{ github.event.pull_request.number || inputs.head_ref }}
  cancel-in-progress: true

jobs:
  neon-preview-env:
    # Same-repo PRs only. A fork PR gets no preview Neon branch (and, under
    # pull_request_target, must not reach these secrets).
    #
    # Not for Dependabot either (ADR 0004). afrikaburn's guard is keyed on the
    # PR's AUTHOR, not `github.actor`: the actor is whoever triggered this
    # event, so a maintainer pushing a fix onto a Dependabot branch would
    # switch provisioning back on. We add the head-ref check, which also covers
    # a Dependabot-named branch pushed by a person (`dependabot/test-guard`).
    # Such a PR's Vercel deploy is Ignored by scripts/vercel-ignore-build.sh.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          # pull_request_target checks out the base ref by default: the
          # trusted copy of the script. Do not change this to the PR head.
          persist-credentials: false

      - name: Provision Neon branch + Vercel Preview env
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_IDS: ${{ secrets.VERCEL_PROJECT_IDS }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          # Empty under workflow_dispatch; the script then redeploys the
          # branch's latest deployment instead of building this sha.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_REPO_ID: ${{ github.event.repository.id }}
        run: bash scripts/neon-preview-env.sh
